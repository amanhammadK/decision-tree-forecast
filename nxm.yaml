schema_version: "3.0"
id: "nxm.model.decision-tree-forecast"
name: "Decision Tree Forecast"
version: "2.0.0"
type: "model"
description: "Production-ready model for the NxM Marketplace."

marketplace:
  enabled: true
  pricing:
    currency: "USDC"
    amount: 29.00
    model: "one-time"
  tags:
    - "model"
    - "nxm"
  min_reputation_tier: 1

runtime:
  language: "python"
  version: ">=3.11"
  entrypoint: "python main.py"
  port: 8080
  docker:
    file: "./Dockerfile"

dependencies:
  sdk:
    name: "@nxm/sdk"
    version: "^1.0.0"
  external_apis: []

security:
  vault_policies:
    - "nxm-agent-base"
  entitlements:
    - "network:outbound"
